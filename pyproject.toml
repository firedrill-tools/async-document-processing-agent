[project]
name = "async-document-processing-agent"
version = "0.2.0"
readme = "README.md"
description = "Durable document job worker with Google ADK extraction"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0", "google-genai==2.31.0", "httpx==0.28.1"]

[project.scripts]
document-worker = "document_worker.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_worker"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "document_worker/sample_data"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "fixtures", "tests", "scripts", "scenarios", "README.md", "AGENTS.md", "PLAN.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
