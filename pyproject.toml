[project]
name = "async-document-processing-agent"
version = "0.1.0"
description = "Durable document job worker with Google ADK extraction"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
